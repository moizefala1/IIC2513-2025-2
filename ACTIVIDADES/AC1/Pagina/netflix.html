<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="icon" href="recursos/browser_tab.webp" type="image/webp">
        <title>Netflix</title>
        <link rel="stylesheet" href="netflix.css">
    </head>

    <body>
        <a href="https://www.netflix.com/cl/">
            <img src="recursos/main_logo.png" class="logo">
        </a>
        <div class="container">
            <h1 style="color: aliceblue;" >Iniciar Sesión</h1>
            <input type="text" class="input" name="login" placeholder="Email o numero de telefono">
            <input type="password" class="input" name="password" placeholder="Contraseña">
            <button class="button" type="submit">Iniciar Sesión</button>
            <h2 style="color: aliceblue; margin: auto;">O</h2> 
            <button class="button">Usar codigo de inicio de sesion</button> 
            <a href="https://www.netflix.com/cl/" class="link">Suscribete ya</a>
            <a href="https://www.netflix.com/cl/loginHelp" class="link">¿Olvidaste tu contraseña?</a>
        </div>
    </body>
</html>
